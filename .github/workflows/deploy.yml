name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish WebUI
      run: dotnet publish GameHaven.WebUI/GameHaven.WebUI.csproj -c Release -o release --nologo
    
    # Change base-tag in index.html from / to GameHaven to match GitHub Pages repository format
    - name: Change base-tag in index.html
      run: sed -i 's/<base href="\/" \/>/<base href="\/GameHaven\/" \/>/g' release/wwwroot/index.html

    - name: Fix blazor.webassembly.js filename
      run: |
        cd release/wwwroot/_framework
        hashed_file=$(ls blazor.webassembly.*.js | head -n 1)
        if [ -n "$hashed_file" ] && [ ! -f blazor.webassembly.js ]; then
          cp $hashed_file blazor.webassembly.js
        fi

    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: Add 404.html for SPA routing
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'release/wwwroot'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
